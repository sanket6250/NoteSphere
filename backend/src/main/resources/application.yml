server:
  port: 8080
spring:
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: ${APP_MAX_ARCHIVE_SIZE:260MB}
      max-request-size: ${APP_MAX_ARCHIVE_SIZE:260MB}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
app:
  archive:
    max-size: ${APP_MAX_ARCHIVE_SIZE:260MB}
  upload:
    max-size: ${APP_MAX_UPLOAD_SIZE:25MB}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
