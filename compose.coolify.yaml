name: notesphere-production

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in Coolify}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in Coolify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
      APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER in Coolify}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in Coolify}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/initialize-postgres-app-role.sh:/docker-entrypoint-initdb.d/10-create-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - data-private
    labels:
      com.notesphere.stack: production
      com.notesphere.service: postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in Coolify}
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USER:?Set APP_DB_USER in Coolify}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in Coolify}
      APP_MAX_ARCHIVE_SIZE: ${APP_MAX_ARCHIVE_SIZE:-260MB}
      APP_MAX_UPLOAD_SIZE: ${APP_MAX_UPLOAD_SIZE:-25MB}
      APP_AUTH_USERNAME: ${APP_AUTH_USERNAME:?Set APP_AUTH_USERNAME in Coolify}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:?Set APP_AUTH_PASSWORD in Coolify}
      APP_AUTH_SUPER_PASSWORD: ${APP_AUTH_SUPER_PASSWORD:-notesphere123}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    stop_grace_period: 35s
    networks:
      - data-private
      - api-private
    labels:
      com.notesphere.stack: production
      com.notesphere.service: backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - api-private
      - coolify
    labels:
      com.notesphere.stack: production
      com.notesphere.service: frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
    name: notesphere-production-postgres-data
  # Preserve the legacy object volume; the backfill procedure does not delete it.
  object-data:
    name: notesphere-production-object-data

networks:
  data-private:
    name: notesphere-production-data
    internal: true
  api-private:
    name: notesphere-production-api
    internal: true
  coolify:
    name: coolify
    external: true
